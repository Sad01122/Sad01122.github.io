<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Poppins, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arn2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1100" height="520" rx="18" fill="#0b1220"/>
  <text x="550" y="38" text-anchor="middle" fill="#e7eefb" font-size="23" font-weight="800">FROM LAPTOP TO WEB SERVER - THE REAL PATH</text>
  <text x="550" y="61" text-anchor="middle" fill="#8fa3c0" font-size="12.5">Six jobs in a row - a failure at any hop breaks the journey</text>

  <!-- STEP NUMBERS -->
  <g font-size="11" font-weight="800" fill="#0b1220">
    <circle cx="122" cy="88" r="12" fill="#22d3ee"/><text x="122" y="92" text-anchor="middle">1</text>
    <circle cx="322" cy="88" r="12" fill="#22d3ee"/><text x="322" y="92" text-anchor="middle">2</text>
    <circle cx="510" cy="88" r="12" fill="#a78bfa"/><text x="510" y="92" text-anchor="middle">3</text>
    <circle cx="695" cy="88" r="12" fill="#a78bfa"/><text x="695" y="92" text-anchor="middle">4</text>
    <circle cx="870" cy="88" r="12" fill="#fbbf24"/><text x="870" y="92" text-anchor="middle">5</text>
    <circle cx="1030" cy="200" r="12" fill="#34d399"/><text x="1030" y="204" text-anchor="middle">6</text>
  </g>

  <!-- DEVICE BOXES -->
  <g text-anchor="middle">
    <rect x="30" y="112" width="185" height="88" rx="12" fill="#182741" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="122" y="139" fill="#e7eefb" font-size="13.5" font-weight="800">LAPTOP + NIC</text>
    <text x="122" y="160" fill="#c7d3e6" font-size="10.5">network interface card</text>
    <text x="122" y="177" fill="#8fa3c0" font-size="10">MAC address lives here</text>
    <text x="122" y="192" fill="#8fa3c0" font-size="10">builds frames</text>

    <rect x="240" y="112" width="165" height="88" rx="12" fill="#182741" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="322" y="139" fill="#e7eefb" font-size="13.5" font-weight="800">SWITCH / AP</text>
    <text x="322" y="160" fill="#c7d3e6" font-size="10.5">local network</text>
    <text x="322" y="177" fill="#8fa3c0" font-size="10">forwards by MAC</text>
    <text x="322" y="192" fill="#8fa3c0" font-size="10">Layer 2</text>

    <rect x="430" y="112" width="160" height="88" rx="12" fill="#182741" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="510" y="139" fill="#e7eefb" font-size="13" font-weight="800">ROUTER / GATEWAY</text>
    <text x="510" y="160" fill="#c7d3e6" font-size="10.5">connects networks</text>
    <text x="510" y="177" fill="#8fa3c0" font-size="10">forwards by IP + routes</text>
    <text x="510" y="192" fill="#8fa3c0" font-size="10">Layer 3 · NAT · firewall</text>

    <rect x="615" y="112" width="160" height="88" rx="12" fill="#182741" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="695" y="139" fill="#e7eefb" font-size="13.5" font-weight="800">INTERNET</text>
    <text x="695" y="160" fill="#c7d3e6" font-size="10.5">many routers + ISPs</text>
    <text x="695" y="177" fill="#8fa3c0" font-size="10">packets hop network</text>
    <text x="695" y="192" fill="#8fa3c0" font-size="10">to network · no owner</text>

    <rect x="800" y="112" width="140" height="88" rx="12" fill="#182741" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="870" y="139" fill="#e7eefb" font-size="12.5" font-weight="800">LOAD BALANCER</text>
    <text x="870" y="160" fill="#c7d3e6" font-size="10">picks a healthy server</text>
    <text x="870" y="177" fill="#8fa3c0" font-size="10">health checks</text>
    <text x="870" y="192" fill="#8fa3c0" font-size="10">Layer 4 (or 7)</text>
  </g>

  <!-- ARROWS -->
  <g stroke="#22d3ee" stroke-width="2.2" fill="none" marker-end="url(#arn)">
    <line x1="217" y1="156" x2="234" y2="156"/>
    <line x1="407" y1="156" x2="424" y2="156"/>
    <line x1="592" y1="156" x2="609" y2="156"/>
    <line x1="777" y1="156" x2="794" y2="156"/>
  </g>

  <!-- SERVER STACK -->
  <g text-anchor="middle" font-size="10">
    <rect x="975" y="220" width="110" height="26" rx="6" fill="#122a22" stroke="#34d399"/>
    <text x="1030" y="237" fill="#d9f7ea">Web server 1</text>
    <rect x="975" y="252" width="110" height="26" rx="6" fill="#122a22" stroke="#34d399"/>
    <text x="1030" y="269" fill="#d9f7ea">Web server 2</text>
    <rect x="975" y="284" width="110" height="26" rx="6" fill="#122a22" stroke="#34d399"/>
    <text x="1030" y="301" fill="#d9f7ea">Web server 3</text>
  </g>
  <g stroke="#fbbf24" stroke-width="1.8" fill="none" marker-end="url(#arn)">
    <path d="M870 200 V297 H971"/>
    <path d="M870 233 H971"/>
    <path d="M870 265 H971"/>
  </g>
  <text x="1030" y="326" text-anchor="middle" fill="#8fa3c0" font-size="9">health checks</text>

  <!-- RETURN PATH -->
  <path d="M1030 340 V380 H122 V208" fill="none" stroke="#34d399" stroke-width="2.2" stroke-dasharray="8 6" marker-end="url(#arn2)"/>
  <text x="600" y="397" text-anchor="middle" fill="#34d399" font-size="11" font-weight="700">THE RESPONSE follows a return path - routes can differ in each direction</text>

  <!-- SECURITY STRIP -->
  <rect x="24" y="418" width="1052" height="82" rx="12" fill="#121c31" stroke="#26344f"/>
  <text x="44" y="443" fill="#fb7185" font-size="12" font-weight="800">EVERY HOP IS ATTACK SURFACE:</text>
  <g fill="#c7d3e6" font-size="10.5">
    <text x="44" y="464">NIC / endpoint - malware, spoofing, rogue devices</text>
    <text x="400" y="464">switch / AP - unauthorised ports, VLAN mistakes, interception</text>
    <text x="800" y="464">router - weak admin password, old firmware, bad ACLs</text>
    <text x="44" y="486">modem / ISP box - exposed management page, default credentials</text>
    <text x="400" y="486">load balancer - DoS, TLS/certificate faults, app attacks</text>
    <text x="800" y="486">servers - patching, least privilege, logging</text>
  </g>
</svg>
