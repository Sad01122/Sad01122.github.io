<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Poppins, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22d3ee"/>
    </marker>
  </defs>

  <rect width="1000" height="720" rx="18" fill="#0b1220"/>
  <text x="500" y="38" text-anchor="middle" fill="#e7eefb" font-size="23" font-weight="800">THE SOFTWARE QUALITY MAP</text>
  <text x="500" y="61" text-anchor="middle" fill="#8fa3c0" font-size="12.5">Quality is not one activity - it is a chain from prevention to detection</text>

  <!-- ROOT -->
  <rect x="250" y="80" width="500" height="46" rx="11" fill="#182741" stroke="#22d3ee" stroke-width="1.6"/>
  <text x="500" y="99" text-anchor="middle" fill="#e7eefb" font-size="13" font-weight="800">SOFTWARE QUALITY (ISO 9000:2000)</text>
  <text x="500" y="117" text-anchor="middle" fill="#8fa3c0" font-size="10.5">degree to which inherent characteristics fulfil requirements</text>

  <g stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#ar2)">
    <path d="M380 126 V144 H280 V154"/>
    <path d="M620 126 V144 H720 V154"/>
  </g>

  <!-- V and V -->
  <rect x="70" y="158" width="420" height="112" rx="12" fill="#121c31" stroke="#22d3ee"/>
  <text x="280" y="181" text-anchor="middle" fill="#22d3ee" font-size="13.5" font-weight="800">VERIFICATION - "build the product RIGHT"</text>
  <text x="280" y="203" text-anchor="middle" fill="#e7eefb" font-size="11.5">Are we following the specification and design?</text>
  <text x="280" y="224" text-anchor="middle" fill="#c7d3e6" font-size="11">STATIC techniques: reviews - walkthroughs - inspections</text>
  <text x="280" y="244" text-anchor="middle" fill="#c7d3e6" font-size="11">Checks plans, requirements, design, code, test cases</text>
  <text x="280" y="262" text-anchor="middle" fill="#8fa3c0" font-size="10">finds problems before the code runs</text>

  <rect x="510" y="158" width="420" height="112" rx="12" fill="#121c31" stroke="#34d399"/>
  <text x="720" y="181" text-anchor="middle" fill="#34d399" font-size="13.5" font-weight="800">VALIDATION - "build the RIGHT product"</text>
  <text x="720" y="203" text-anchor="middle" fill="#e7eefb" font-size="11.5">Does it actually meet the user's real needs?</text>
  <text x="720" y="224" text-anchor="middle" fill="#c7d3e6" font-size="11">DYNAMIC techniques: run the software</text>
  <text x="720" y="244" text-anchor="middle" fill="#c7d3e6" font-size="11">unit - integration - system - acceptance testing</text>
  <text x="720" y="262" text-anchor="middle" fill="#8fa3c0" font-size="10">checks the product after it is built</text>

  <!-- TESTING vs DEBUGGING -->
  <text x="500" y="300" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="800" letter-spacing="1.4">WHO DOES WHAT</text>

  <rect x="60" y="314" width="410" height="108" rx="12" fill="#121c31" stroke="#26344f"/>
  <text x="265" y="338" text-anchor="middle" fill="#fb7185" font-size="13" font-weight="800">TESTING = FIND (do not fix)</text>
  <text x="265" y="359" text-anchor="middle" fill="#e7eefb" font-size="11">"execute a program with the intention of finding errors" - Myers</text>
  <text x="265" y="379" text-anchor="middle" fill="#c7d3e6" font-size="11">asks: does it fail? where? under which input?</text>
  <text x="265" y="399" text-anchor="middle" fill="#c7d3e6" font-size="11">done by QA/testers, developers, managers, end users</text>
  <text x="265" y="415" text-anchor="middle" fill="#8fa3c0" font-size="10">testing can show bugs exist - never that none exist (Dijkstra)</text>

  <rect x="530" y="314" width="410" height="108" rx="12" fill="#121c31" stroke="#26344f"/>
  <text x="735" y="338" text-anchor="middle" fill="#34d399" font-size="13" font-weight="800">DEBUGGING = LOCATE + FIX</text>
  <text x="735" y="359" text-anchor="middle" fill="#e7eefb" font-size="11">reproduce - isolate - correct - retest</text>
  <text x="735" y="379" text-anchor="middle" fill="#c7d3e6" font-size="11">done by the developer who wrote the code</text>
  <text x="735" y="399" text-anchor="middle" fill="#c7d3e6" font-size="11">part of unit / white-box work</text>
  <text x="735" y="415" text-anchor="middle" fill="#8fa3c0" font-size="10">testing finds the bug; debugging removes it</text>

  <!-- BLACK vs WHITE -->
  <text x="500" y="446" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="800" letter-spacing="1.4">HOW DO WE LOOK AT THE CODE?</text>

  <rect x="60" y="460" width="410" height="118" rx="12" fill="#121c31" stroke="#a78bfa"/>
  <text x="265" y="484" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="800">BLACK BOX - the user's view</text>
  <text x="265" y="505" text-anchor="middle" fill="#e7eefb" font-size="11">No source code needed: input -&gt; output</text>
  <text x="265" y="525" text-anchor="middle" fill="#c7d3e6" font-size="11">also called closed-box / functional testing</text>
  <text x="265" y="545" text-anchor="middle" fill="#c7d3e6" font-size="11">finds missing or wrong functions, not hidden paths</text>
  <text x="265" y="565" text-anchor="middle" fill="#8fa3c0" font-size="10">techniques: equivalence partitioning - boundary values - decision tables</text>

  <rect x="530" y="460" width="410" height="118" rx="12" fill="#121c31" stroke="#22d3ee"/>
  <text x="735" y="484" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="800">WHITE BOX - the developer's view</text>
  <text x="735" y="505" text-anchor="middle" fill="#e7eefb" font-size="11">Code, branches, loops and paths are visible</text>
  <text x="735" y="525" text-anchor="middle" fill="#c7d3e6" font-size="11">also called glass-box / structural / code-based testing</text>
  <text x="735" y="545" text-anchor="middle" fill="#c7d3e6" font-size="11">finds hidden logic errors; cannot spot missing requirements</text>
  <text x="735" y="565" text-anchor="middle" fill="#8fa3c0" font-size="10">techniques: statement - branch - path coverage</text>

  <!-- QA vs QC -->
  <text x="500" y="600" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="800" letter-spacing="1.4">PREVENT vs DETECT</text>

  <rect x="60" y="613" width="410" height="76" rx="12" fill="#121c31" stroke="#34d399"/>
  <text x="265" y="636" text-anchor="middle" fill="#34d399" font-size="12.5" font-weight="800">QUALITY ASSURANCE (QA) - prevent</text>
  <text x="265" y="656" text-anchor="middle" fill="#c7d3e6" font-size="10.5">activities defined before production, run across the whole cycle</text>
  <text x="265" y="674" text-anchor="middle" fill="#8fa3c0" font-size="10">benchmarking - quality audits - standards - process improvement</text>

  <rect x="530" y="613" width="410" height="76" rx="12" fill="#121c31" stroke="#fb7185"/>
  <text x="735" y="636" text-anchor="middle" fill="#fb7185" font-size="12.5" font-weight="800">QUALITY CONTROL (QC) - detect</text>
  <text x="735" y="656" text-anchor="middle" fill="#c7d3e6" font-size="10.5">checks whether the defined requirements of the product are met</text>
  <text x="735" y="674" text-anchor="middle" fill="#8fa3c0" font-size="10">inspections - testing - defect tracking - corrective action</text>
</svg>
